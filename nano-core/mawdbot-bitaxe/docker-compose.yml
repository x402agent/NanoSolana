# ═══════════════════════════════════════════════════════════════
#  MawdAxe Fleet Infrastructure
#  
#  Scale: 100-1000 devices
#  
#  docker compose up -d
# ═══════════════════════════════════════════════════════════════

services:
  # ─── MawdAxe Agent ───
  mawdaxe:
    build: .
    container_name: mawdaxe
    restart: unless-stopped
    network_mode: host  # Needs LAN access to Bitaxe devices
    env_file: .env
    environment:
      - MAWDAXE_API_PORT=8420
      - MAWDAXE_API_HOST=0.0.0.0
    volumes:
      - mawdaxe-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8420/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Tailscale Sidecar (for OpenClaw mesh) ───
  tailscale:
    image: tailscale/tailscale:latest
    container_name: mawdaxe-tailscale
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY:-}
      - TS_HOSTNAME=mawdaxe-${HOSTNAME:-node}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-tags=tag:mawdaxe
    volumes:
      - tailscale-state:/var/lib/tailscale
    profiles:
      - mesh  # Only starts with: docker compose --profile mesh up

  # ─── Prometheus (metrics) ───
  prometheus:
    image: prom/prometheus:latest
    container_name: mawdaxe-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    profiles:
      - monitoring

  # ─── Grafana (dashboards) ───
  grafana:
    image: grafana/grafana:latest
    container_name: mawdaxe-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-mawdaxe}
    volumes:
      - grafana-data:/var/lib/grafana
    profiles:
      - monitoring

volumes:
  mawdaxe-data:
  tailscale-state:
  prometheus-data:
  grafana-data:
