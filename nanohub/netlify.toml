[build]
  command = "bun install && bun run build"
  publish = ".output/public"
  functions = ".output/server"

[build.environment]
  NODE_VERSION = "20"
  BUN_VERSION = "1.3.9"

# Convex real-time connection (frontend uses this directly via WebSocket)
[context.production.environment]
  VITE_CONVEX_URL = "https://original-ibex-124.convex.cloud"
  VITE_CONVEX_SITE_URL = "https://original-ibex-124.convex.site"
  SITE_URL = "https://nanosolana.netlify.app"
  CONVEX_SITE_URL = "https://original-ibex-124.convex.site"

# Proxy /api/* requests to the Convex HTTP API
[[redirects]]
  from = "/api/*"
  to = "https://original-ibex-124.convex.site/api/:splat"
  status = 200
  force = true

# SPA fallback — let the SSR server handle all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
